<!doctype html>
<html lang="ru">
  <body style="margin:0;background:#08101f;color:#f7f9ff;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#08101f;padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid #29405f;border-radius:18px;background:#101b2d;overflow:hidden">
            <tr><td style="padding:26px 28px 18px;border-bottom:1px solid #29405f;font-size:14px;font-weight:700;color:#8fb9ff">HC&nbsp;&nbsp; Homework Copilot</td></tr>
            <tr><td style="padding:28px 28px 0;font-size:30px;line-height:1.15;font-weight:700;color:#f7f9ff">Подтверди почту</td></tr>
            <tr><td style="padding:12px 28px 0;font-size:15px;line-height:1.55;color:#b8c5d9">Введи эти шесть цифр в окне регистрации:</td></tr>
            <tr><td style="padding:22px 28px 18px"><div style="padding:18px;border-radius:10px;background:#2168df;color:#ffffff;font-family:Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center">{{ .Token }}</div></td></tr>
            <tr><td style="padding:0 28px 22px;font-size:13px;line-height:1.55;color:#8fa1ba">Код действует 5 минут. Новый код можно запросить через минуту.</td></tr>
            <tr><td style="padding:0 28px 30px"><a href="{{ .SiteURL }}/app?auth=confirm&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:block;padding:14px 18px;border-radius:8px;background:#f7f9ff;color:#08101f;font-size:14px;font-weight:700;text-align:center;text-decoration:none">Подтвердить почту</a></td></tr>
            <tr><td style="padding:20px 28px;border-top:1px solid #29405f;font-size:12px;line-height:1.5;color:#73849d">Если ты не регистрировался в Homework Copilot, просто проигнорируй письмо.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
