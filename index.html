    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Homework Copilot",
        "url": "https://www.homeworkcopilot.ru/",
        "inLanguage": "ru-RU",
        "description": "Сервис для поиска условий по учебнику и подготовки понятных решений школьных задач."
      }
    </script>
    <script>
      try {
        const savedTheme = localStorage.getItem('homework-copilot:theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
