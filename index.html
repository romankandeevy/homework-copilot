<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Homework Copilot превращает номер задачи в полностью готовое решение для тетради." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link rel="icon" href="data:," />
    <title>Homework Copilot</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('homework-copilot:theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: One saved textbook and one task number lead either to an instant shared answer or one new notebook-ready solution; this is not a productivity dashboard.
      OWN-WORLD: Neutral Graphite Mono surfaces, restrained cobalt signals, routed nodes, Unbounded display, Onest body.
      STORY: See the balance, confirm the textbook, enter a number, open a shared answer instantly or wait for one new solution.
      FIRST VIEWPORT: The active navigation route frames one calm graphite copying surface; the saved textbook sits directly above the task number and cobalt action.
      FORM: Direct task entry inside the established visual world, seed d1000b40.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
