    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Homework Copilot",
            "url": "https://www.homeworkcopilot.ru/",
            "inLanguage": "ru-RU",
            "description": "Сервис, который решает школьную задачу по фотографии или тексту условия и оформляет решение как запись в тетради."
          },
          {
            "@type": "WebApplication",
            "name": "Homework Copilot",
            "url": "https://www.homeworkcopilot.ru/app",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Веб-браузер",
            "inLanguage": "ru-RU",
            "description": "Условие задачи фотографией или текстом, решение с «дано», ходом решения, чертежом и ответом. 14 предметов, 5–11 класс.",
            "offers": {
              "@type": "Offer",
              "price": "5",
              "priceCurrency": "RUB",
              "description": "Одно решение задачи"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Нужен ли учебник из какого-то списка?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Нет. Условие приносит сам ученик — фотографией или текстом, поэтому подойдёт любой учебник, рабочая тетрадь, карточка от учителя или свой вариант."
                }
              },
              {
                "@type": "Question",
                "name": "Нужна ли регистрация?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Первое решение выдаётся без аккаунта. Аккаунт нужен со второго: решение привязывается к балансу и остаётся в истории. Сразу после регистрации на счёте 20 ₽."
                }
              },
              {
                "@type": "Question",
                "name": "Сколько это стоит?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Первое решение бесплатное и без регистрации. Дальше 5 ₽ за задачу независимо от предмета и способа ввода. Ответ в ИИ-чате — от 20 копеек. Расписание бесплатное."
                }
              },
              {
                "@type": "Question",
                "name": "А если решение окажется неверным?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "В каждом решении есть кнопка «Сообщить об ошибке»: условие и ход решения уходят в поддержку целиком. Если задача не прошла внутреннюю проверку, она не выдаётся, и деньги остаются на балансе."
                }
              }
            ]
          }
        ]
      }
    </script>
    <script>
      try {
        const savedTheme = localStorage.getItem('homework-copilot:theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
