name: Deploy GitHub Pages

on:
  # Прод выкатывается только вручную: Actions → Deploy GitHub Pages → Run
  # workflow. Vercel обновляет превью (homework-copilot-taupe.vercel.app)
  # сам на каждый push в main — там и проверяем перед этой командой.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Браузерные проверки не гонялись в CI вовсе: к 2 сентября из 45 тестов
      # падали 12, и половина — под давно удалённый раздел. Снимки тетради
      # сюда не входят: эталоны сняты на Windows, а сборка идёт на Linux, где
      # шрифты рисуются иначе. Их прогоняют локально — `npm run test:visual`.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Тот же адрес, что и у сборки. Без него vite.config видит GITHUB_ACTIONS
          # без домена и поднимает dev-сервер с базой `/homework-copilot/`:
          # переход на `/app` упирается в подсказку «did you mean /homework-copilot/app»,
          # и падают все тесты подряд, а не один. Первый прогон в CI на это и налетел.
          GITHUB_PAGES_CUSTOM_DOMAIN: www.homeworkcopilot.ru
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Если браузерные проверки упали, отчёт нужен целиком: в нём лежит
      # снимок страницы на момент падения, а по одному симптому причину
      # на другой системе не восстановить.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
      - run: npm run build
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN: www.homeworkcopilot.ru
          VITE_HOMEWORK_API_URL: https://homework-copilot-taupe.vercel.app/api/solve
          VITE_SUPPORT_API_URL: https://homework-copilot-taupe.vercel.app/api/support
          VITE_CHAT_API_URL: https://homework-copilot-taupe.vercel.app/api/chat
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
